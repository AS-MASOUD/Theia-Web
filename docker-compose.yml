services:
  theia-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theia_web
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://theia-finance.ir}
      NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-https://app.theia-finance.ir}
